name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  quality:
    name: Syntax and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'
      - name: Validate GitHub Actions workflows with actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check Python syntax and undefined names
        run: |
          python -m compileall -q companion tools tests
          python -m ruff check .
      - name: Check browser JavaScript syntax
        run: |
          node --check companion/web/app.js
          node --check companion/web/i18n.js
          node tests/test_companion_i18n.js
      - name: Render all companion pages in every language
        run: |
          npm ci --prefix tests/browser --no-audit --no-fund
          node tests/browser/smoke.cjs
      - name: Verify generated textures
        run: python tools/build.py --check
      - name: Check all Lua files with Lua 5.1
        shell: python
        run: |
          from pathlib import Path
          from lupa.lua51 import LuaRuntime
          lua = LuaRuntime()
          compile_lua = lua.eval('function(source, name) local fn, err = loadstring(source, name); assert(fn, err) end')
          for path in Path('addon').rglob('*.lua'):
              compile_lua(path.read_text(encoding='utf-8'), str(path))

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Python, Lua 5.1, HTTP and packaging tests (no skips)
        run: python -m coverage run tests/check.py
      - name: Run companion CLI with synthetic data
        run: |
          python companion/app.py --help
          python companion/app.py --demo --scan
      - name: Export Python coverage
        run: |
          python -m coverage report
          python -m coverage xml
      - name: Keep coverage report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  portable-companion:
    name: Build and test Windows portable companion
    needs: [quality, tests]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-packaging.txt
      - run: python -m pip install -r requirements-packaging.txt
      - name: Build standalone Windows executable
        run: python tools/package_companion.py
      - name: Test extracted executable without Python on PATH
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          archive, = Path('output').glob('SVCleaner-Companion-*-windows-x64.zip')
          subprocess.run([sys.executable, 'tools/verify_companion.py', str(archive)], check=True)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: companion-windows-x64
          path: |
            output/SVCleaner-Companion-*-windows-x64.zip
            output/SVCleaner-Companion-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  packages:
    name: Validate distribution archives
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0 # v6
        with:
          python-version: '3.14'
      - name: Package the addon without uploading
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -e -l -u
          pandoc: 'false'
      - name: Validate the actual BigWigs archive
        run: python tools/verify_archive.py .release/*.zip
      - name: Repackage the prepared addon with publication options (no upload)
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -c -o -e -l -u
          pandoc: 'false'
      - name: Validate the archive after the publication pass
        run: python tools/verify_archive.py .release/*.zip
      - name: Keep installable archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
