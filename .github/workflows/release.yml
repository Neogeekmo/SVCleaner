name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os, re
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(alpha|beta)\.[1-9]\d*)?', tag), 'Use v1.2.3, v1.2.3-alpha.1 or v1.2.3-beta.1'

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to GitHub, CurseForge and Wago
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Require both publication tokens
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        shell: bash
        run: |
          missing=0
          for key in CF_API_KEY WAGO_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing repository Actions secret: $key"
              missing=1
            fi
          done
          exit "$missing"
      - name: Build release package without uploading
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -e -l -u
          pandoc: 'false'
      - name: Validate release contents and tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/verify_archive.py .release/*.zip --version "$RELEASE_TAG"
      - name: Retrieve the tested Windows portable companion
        uses: actions/download-artifact@v8.0.2
        with:
          name: companion-windows-x64
          path: output
      # -c skips copying; -o keeps the already validated runtime folder.
      # Both are required when archiving that folder again for publication.
      # GitHub assets are published separately; keep the addon on CF and Wago.
      - name: Publish the validated addon to CurseForge and Wago
        uses: BigWigsMods/packager@v2.6.1
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ''
          GITHUB_API_TOKEN: ''
        with:
          args: -c -o -e -l -u
          pandoc: 'false'
      - name: Publish the portable companion on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="output/SVCleaner-Companion-${RELEASE_TAG}-windows-x64.zip"
          test -f "$archive"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            options=()
            case "$RELEASE_TAG" in
              *-alpha.*|*-beta.*) options+=(--prerelease) ;;
            esac
            gh release create "$RELEASE_TAG" "$archive" --verify-tag \
              --title "$RELEASE_TAG" --notes-file docs/changelog.md "${options[@]}"
          fi
      - name: Keep release archives even if an upload fails
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-packages
          path: |
            .release/*.zip
            output/SVCleaner-Companion-*-windows-x64.zip
            output/SVCleaner-Companion-*-windows-x64.zip.sha256
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
