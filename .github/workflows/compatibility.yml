name: WoW API compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Fetch Blizzard UI references at recorded Git SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_wow_reference.py
      - name: Verify API documentation and actual call sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_reference_api.py
      - name: Verify native UI widget methods
        run: python tools/check_ui_methods.py
      - name: Keep audit reports even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wow-api-audit
          path: output/compatibility/*.json
          if-no-files-found: warn
          retention-days: 30
