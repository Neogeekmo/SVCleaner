[tool.ruff]
target-version = "py310"
include = ["companion/**/*.py", "tools/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# Check syntax and Pyflakes rules, including unused imports and variables.
select = ["E9", "F"]

[tool.coverage.run]
source = ["companion"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"
